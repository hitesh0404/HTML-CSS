<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #parent{
            position: relative;
        height: 100vh;
        width: 100%;
        background-color: aqua;
    }
    #child{
        position:absolute;
        height: 200px;
        width: 200px;
        left: 30%;
        top:50%;
        background-color: rgb(11, 19, 103);
        transform: translate(-50%,-50%);
    }
    </style>
</head>
<body>
    <div id="parent"    class="">
        <div id="child">
            
        </div>
    </div>
</body>
</html>
