        <option value="EUR">Europian Euro</option>

    <form>

        <label for="amount">Amount</label>
        <input type="number" name="" id="amount" min="1" step="0.1"><br>
       
        <button type="button" onclick="convert()">Convert</button><br>
        <span></span>
    </form>
